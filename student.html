<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 24px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #1a1a2e;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            text-align: left;
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e8ecf1;
            color: #333;
            font-size: 14px;
        }
        tbody tr:nth-child(even) {
            background: #f0f4ff;
        }
        tbody tr:hover {
            background: #f0f4ff;
        }
        .action-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-right: 6px;
        }
        .action-btn:first-child {
            background: #2a7de1;
            color: #fff;
        }
        .action-btn:first-child:hover {
            background: #1b62b5;
        }
        .action-btn:last-child {
            background: #e74c3c;
            color: #fff;
        }
        .action-btn:last-child:hover {
            background: #c0392b;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div >
        <h1>View Students</h1>
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Student Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>sirisha</td>
                    <td>divi</td>
                    <td>sirishadivi@gmail.com</td>
                    <td>
                        <button class="action-btn">Edit</button>
                        <button class="action-btn">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>poojitha</td>
                    <td>gopu</td>
                    <td>poojithagopu@gmail.com</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="window.location.href='student.html.html'">Edit</button>
                        <button class="action-btn delete-btn">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
